name: Temporary ALIGN-047 FA wheel relay
on:
  push:
    branches: [main]
    paths: [.github/workflows/align047-fa-wheel-relay.yml]
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELAY_BRANCH: align047-fa-wheel-relay-temp
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Download pinned compatibility wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wheel_relay && mkdir wheel_relay
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps -d wheel_relay \
            'qwen-asr==0.0.6' 'transformers==4.57.6' 'accelerate==1.12.0' \
            'tokenizers==0.22.2' 'av==18.1.0' 'qwen-omni-utils==0.0.9' \
            'huggingface-hub==0.36.2' 'soundfile==0.14.0' 'safetensors==0.8.0' \
            'soxr==1.1.0' 'sox==1.5.0' 'nagisa==0.2.11'
          sha256sum wheel_relay/* | LC_ALL=C sort > wheel_relay.sha256
          ls -lh wheel_relay
      - name: Publish temporary wheel branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C "$RELAY_BRANCH"
          git add wheel_relay wheel_relay.sha256
          git commit -m 'chore: temporary public pinned FA wheels'
          git push --force origin "$RELAY_BRANCH"
