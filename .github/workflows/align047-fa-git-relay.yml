name: Temporary ALIGN-047 public Qwen FA git relay v2

on:
  push:
    branches: [main]
    paths: [.github/workflows/align047-fa-git-relay.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODEL_ID: Qwen/Qwen3-ForcedAligner-0.6B
      MODEL_REVISION: c7cbfc2048c462b0d63a45797104fc9db3ad62b7
      EXPECTED_WEIGHTS_SHA256: 47831d0e82f96b20e9034dba01a075ee06436654719f6a68289e49f1b65ce0e7
      RELAY_BRANCH: align047-fa-relay-temp
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'huggingface-hub==0.36.2'
      - name: Materialize and verify public model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id=os.environ['MODEL_ID'], revision=os.environ['MODEL_REVISION'], local_dir='model')
          PY
          rm -rf model/.cache
          test "$(sha256sum model/model.safetensors | awk '{print $1}')" = "$EXPECTED_WEIGHTS_SHA256"
          rm -rf relay_parts && mkdir -p relay_parts/meta
          split -b 90M -d -a 2 model/model.safetensors relay_parts/model.safetensors.part-
          find model -maxdepth 1 -type f ! -name model.safetensors -exec cp {} relay_parts/meta/ \;
          sha256sum relay_parts/model.safetensors.part-* | LC_ALL=C sort > relay_parts/parts.sha256
          (cd relay_parts/meta && sha256sum * | LC_ALL=C sort > ../meta.sha256)
          printf '%s\n' "$MODEL_ID" > relay_parts/model_id.txt
          printf '%s\n' "$MODEL_REVISION" > relay_parts/revision.txt
          printf '%s  model.safetensors\n' "$EXPECTED_WEIGHTS_SHA256" > relay_parts/model.safetensors.sha256
      - name: Publish temporary git branch in bounded pushes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config http.postBuffer 524288000
          git switch -C "$RELAY_BRANCH"
          parts=(relay_parts/model.safetensors.part-*)
          git add relay_parts/meta relay_parts/parts.sha256 relay_parts/meta.sha256 relay_parts/model.safetensors.sha256 relay_parts/model_id.txt relay_parts/revision.txt
          for p in "${parts[@]:0:7}"; do git add "$p"; done
          git commit -m 'chore: temporary public FA relay parts 1'
          git push --force origin "$RELAY_BRANCH"
          for p in "${parts[@]:7:7}"; do git add "$p"; done
          git commit -m 'chore: temporary public FA relay parts 2'
          git push origin "$RELAY_BRANCH"
          for p in "${parts[@]:14}"; do git add "$p"; done
          git commit -m 'chore: temporary public FA relay parts 3'
          git push origin "$RELAY_BRANCH"
