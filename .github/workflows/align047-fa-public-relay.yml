name: Temporary ALIGN-047 public Qwen FA relay

on:
  push:
    branches: [main]
    paths: [.github/workflows/align047-fa-public-relay.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODEL_ID: Qwen/Qwen3-ForcedAligner-0.6B
      MODEL_REVISION: c7cbfc2048c462b0d63a45797104fc9db3ad62b7
      EXPECTED_WEIGHTS_SHA256: 47831d0e82f96b20e9034dba01a075ee06436654719f6a68289e49f1b65ce0e7
      RELEASE_TAG: align047-fa-public-relay-temp
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'huggingface-hub==0.36.2'
      - name: Materialize and verify public model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['MODEL_ID'],
              revision=os.environ['MODEL_REVISION'],
              local_dir='model',
          )
          PY
          rm -rf model/.cache
          test "$(sha256sum model/model.safetensors | awk '{print $1}')" = "$EXPECTED_WEIGHTS_SHA256"
          mkdir -p relay/meta
          split -b 240M -d -a 2 model/model.safetensors relay/model.safetensors.part-
          find model -maxdepth 1 -type f ! -name model.safetensors -exec cp {} relay/meta/ \;
          sha256sum relay/model.safetensors.part-* | LC_ALL=C sort > relay/parts.sha256
          (cd relay/meta && sha256sum * | LC_ALL=C sort > ../meta.sha256)
          printf '%s\n' "$MODEL_ID" > relay/model_id.txt
          printf '%s\n' "$MODEL_REVISION" > relay/revision.txt
          printf '%s  model.safetensors\n' "$EXPECTED_WEIGHTS_SHA256" > relay/model.safetensors.sha256
      - name: Publish temporary public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Temporary ALIGN-047 public Qwen FA relay' --notes 'Temporary relay of the public Qwen3-ForcedAligner-0.6B pinned model only. Contains no private or Reserve data.'
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" relay/model.safetensors.part-* relay/parts.sha256 relay/meta.sha256 relay/model.safetensors.sha256 relay/model_id.txt relay/revision.txt relay/meta/*
