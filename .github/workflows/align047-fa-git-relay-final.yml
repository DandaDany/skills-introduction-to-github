name: Temporary ALIGN-047 FA git relay final chunks
on:
  push:
    branches: [main]
    paths: [.github/workflows/align047-fa-git-relay-final.yml]
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODEL_ID: Qwen/Qwen3-ForcedAligner-0.6B
      MODEL_REVISION: c7cbfc2048c462b0d63a45797104fc9db3ad62b7
      EXPECTED_WEIGHTS_SHA256: 47831d0e82f96b20e9034dba01a075ee06436654719f6a68289e49f1b65ce0e7
      RELAY_BRANCH: align047-fa-relay-temp
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'huggingface-hub==0.36.2'
      - name: Recreate verified chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id=os.environ['MODEL_ID'], revision=os.environ['MODEL_REVISION'], local_dir='model')
          PY
          test "$(sha256sum model/model.safetensors | awk '{print $1}')" = "$EXPECTED_WEIGHTS_SHA256"
          rm -rf final_parts && mkdir final_parts
          split -b 90M -d -a 2 model/model.safetensors final_parts/model.safetensors.part-
      - name: Append remaining chunks only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config http.postBuffer 524288000
          git fetch origin "$RELAY_BRANCH"
          git switch -C "$RELAY_BRANCH" "origin/$RELAY_BRANCH"
          for p in final_parts/model.safetensors.part-{14..19}; do
            if [ -f "$p" ]; then cp "$p" relay_parts/; git add "relay_parts/$(basename "$p")"; fi
          done
          if git diff --cached --quiet; then echo 'No remaining chunks'; exit 0; fi
          git commit -m 'chore: temporary public FA relay final parts'
          git push origin "$RELAY_BRANCH"
