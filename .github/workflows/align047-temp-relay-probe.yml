name: Temporary ALIGN-047 public file relay probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/align047-temp-relay-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upload harmless probe to tmpfiles
        shell: bash
        run: |
          set -euo pipefail
          printf 'ALIGN047_PUBLIC_QWEN_RELAY_PROBE\n' > /tmp/probe.txt
          python3 - <<'PY'
          import requests, json
          with open('/tmp/probe.txt','rb') as f:
              r=requests.post('https://tmpfiles.org/api/v1/upload', files={'file':('align047_public_probe.txt',f,'text/plain')}, timeout=60)
          print(r.status_code, r.text)
          r.raise_for_status()
          data=r.json()
          page=data['data']['url']
          direct=page.replace('https://tmpfiles.org/','https://tmpfiles.org/dl/')
          with open('align047_temp_relay_probe.json','w') as o:
              json.dump({'page_url':page,'direct_url':direct},o,indent=2); o.write('\n')
          PY
      - name: Commit probe URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add align047_temp_relay_probe.json
          git commit -m 'chore: record temporary public relay probe URL'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push
